<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Tarjeta Bancaria</title>
    <link rel="stylesheet" href="/Necli-main/css/card.css"> 
</head>
<body>
    
    <div class="card-checkout-container">
        
        <div class="card-scene">
            <div class="flip-card" id="cardFlip">
                
                <div class="card-face card-front">
                    <div class="chip"></div>
                    <div class="card-bank-logo">NECLI</div>
                    
                    <div class="card-number" id="cardNumDisplay">
                        <span>####</span> <span>####</span> <span>####</span> <span>####</span>
                    </div>

                    <div class="card-details">
                        <div class="card-holder">
                            <label>Titular</label>
                            <div class="card-name" id="cardNameDisplay">NOMBRE TITULAR</div>
                        </div>
                        
                        <div class="card-expiry">
                            <label>Vence</label>
                            <div class="card-date" id="cardExpiryDisplay">MM/AA</div>
                        </div>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="card-black-strip"></div>
                    <div class="card-cvv-area">
                        <label>CVV</label>
                        <div class="card-cvv" id="cardCVVDisplay">***</div>
                    </div>
                    <div class="card-disclaimer">
                        Esta tarjeta es propiedad del banco y debe ser devuelta si es requerida.
                    </div>
                </div>
            </div>
        </div>
        
        <div id="tempAlert" class="temp-alert">
            
        </div>

        <div id="successView">
            <button id="homeButton">
                Volver
            </button>
        </div>

        <form id="paymentForm" class="card-form">
            <h3>Detalles de la Tarjeta</h3>
            
            <label for="cardNumber">Número de Tarjeta</label>
            <input type="text" id="cardNumber" maxlength="19" required placeholder="Ej: 4000 1234 5678 9012">
            
            <label for="cardName">¿Cómo quieres que te llamen en la tarjeta?</label>
            <input type="text" id="cardName" required placeholder="Tu Nombre Deseado">
            <div class="form-row">
                <div class="form-group">
                    <label for="cardExpiry">Fecha de Vencimiento</label>
                    <input type="text" id="cardExpiry" maxlength="5" required placeholder="MM/AA">
                </div>
                
                <div class="form-group">
                    <label for="cardCVV">CVV</label>
                    <input type="text" id="cardCVV" maxlength="3" required placeholder="***">
                </div>
            </div>
            
            <button type="submit" id="payButton">Guardar Tarjeta</button>
        </form>
    </div>
    
    <script src="/Necli-main/js/card.js"></script> 
</body>
</html>
