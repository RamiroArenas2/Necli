<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tarjeta Necli</title>
    <link rel="stylesheet" href="/Necli-main/css/card.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

    <div class="card-checkout-container">

        <div class="header-section">
            <h2>Tu Tarjeta Digital</h2>
            <p>Úsala para tus compras en línea</p>
            <div class="status-badge">
                <span class="dot"></span> Activa
            </div>
        </div>

        <div class="card-scene">
            <div class="flip-card" id="cardFlip">

                <div class="card-face card-front">
                    <div class="chip"></div>
                    <div class="card-bank-logo">NECLI</div>

                    <div class="card-number" id="cardNumDisplay">
                        **** **** **** ****
                    </div>

                    <div class="card-details">
                        <div class="card-holder">
                            <label>Titular</label>
                            <div class="card-name" id="cardNameDisplay">CARGANDO...</div>
                        </div>

                        <div class="card-expiry">
                            <label>Vence</label>
                            <div class="card-date" id="cardExpiryDisplay">MM/AA</div>
                        </div>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="card-black-strip"></div>
                    <div class="card-cvv-area">
                        <label>CVV</label>
                        <div class="card-cvv" id="cardCVVDisplay">***</div>
                    </div>
                    <div class="card-disclaimer">
                        Esta tarjeta es propiedad de Necli Bank. Prohibida su reproducción.
                    </div>
                </div>
            </div>
        </div>

        <div class="actions-grid">
            <button class="action-btn" id="btnCopy">
                <i class='bx bx-copy icon'></i>
                <span>Copiar</span>
            </button>
            <button class="action-btn" id="btnFreeze">
                <i class='bx bx-lock-open-alt icon'></i>
                <span>Congelar</span>
            </button>
            <button class="action-btn" id="btnSettings">
                <i class='bx bx-cog icon'></i>
                <span>Ajustes</span>
            </button>
        </div>

        <div id="successView" style="display: block;">
            <button id="homeButton">
                Volver al Inicio
            </button>
        </div>

    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-bottom">
            <div class="modal-handle"></div>
            <h3>Configuración</h3>

            <div class="setting-item">
                <div class="setting-text">
                    <h4>Compras por Internet</h4>
                    <small>Habilita pagos en sitios web</small>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-text">
                    <h4>Uso en el exterior</h4>
                    <small>Habilita pagos fuera del país</small>
                </div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider round"></span>
                </label>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

            <button class="btn-option danger">
                Reportar robo o pérdida
            </button>

            <button class="btn-option close-modal" id="btnCloseSettings">
                Cerrar
            </button>
        </div>
    </div>

    <script src="/Necli-main/js/card.js"></script>
</body>

</html>
