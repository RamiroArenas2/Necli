<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Necli-main/css/transfers.css">
    <title>Transferir Dinero</title>
</head>

<body>

    <div class="container-colors">
        <div class="content-purple"></div>
        <div class="content-blue"></div>
    </div>

    <section class="header-transfer">
        <button class="back-btn" id="regresar">⟵</button>
        <h2>Transferir Dinero</h2>
    </section>

    <section class="transfer-container">
        
        <div class="input-group">
            <label>Número de destino</label>
            <input type="text" placeholder="Ej: 3104567890">
        </div>

        <div class="input-group">
            <label>Valor a enviar</label>
            <input type="number" placeholder="$ 0">
        </div>

        <div class="input-group">
            <label>Descripción (opcional)</label>
            <input type="text" placeholder="Ej: Pago pedido">
        </div>

        <button class="btn-primary">Continuar</button>

    </section>



    <script src="/Necli-main/js/transfers.js"></script>
</body>

</html>
