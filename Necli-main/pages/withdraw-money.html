<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirar Dinero - Necli</title>
    <link rel="stylesheet" href="/Necli-main/css/withdraw-money.css">
</head>
<body>
    
    <div class="container-withdraw" id="withdrawContainer"> <h2>Retirar Dinero</h2>

        <form id="withdrawForm">
            <label for="amount">Monto a retirar</label>
            <input type="number" id="amount" min="10000" step="5000" inputmode="numeric" placeholder="$ 10,000" required>

            <label for="method">Método de retiro</label>
            <select id="method" required>
                <option value="">Seleccione una opción</option>
                <option value="necli_atm">Corresponsal Necli (Red Aliada)</option>
                <option value="bancolombia">Corresponsal Bancolombia (A la Mano)</option>
            </select>
            
            <p id="feedbackMessage"></p>

            <button type="submit">Retirar</button>
        </form>
    </div>
    
    <div id="confirmationScreen">
        <span class="confirmation-icon">✅</span> 
        <h3>¡Retiro Solicitado!</h3>
        <p id="confirmationMessage"></p>
        
        <button id="homeButton" class="btn-home">Regresar</button>
    </div>
    <script src="/Necli-main/js/withdraw-money.js"></script>
</body>
</html>
